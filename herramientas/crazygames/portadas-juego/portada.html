<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800;900&display=swap">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url(escena.jpg) var(--pos,52% 50%)/cover no-repeat;filter:contrast(1.12) saturate(1.18) brightness(1.02)}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,26,40,.55) 0%,rgba(20,26,40,0) 38%,rgba(0,0,0,0) 70%,rgba(30,18,5,.45) 100%),radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 45%,rgba(0,0,0,.5) 100%)}
.logo{position:absolute;left:0;right:0;top:var(--top,5%);text-align:center;font-family:'Saira Condensed';line-height:.86}
.t{font-weight:900;font-size:var(--big,230px);letter-spacing:.02em;
 background:linear-gradient(180deg,#f4f1ea 0%,#cfc8bb 42%,#8d877c 52%,#c9c2b4 70%,#7a7468 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:3px #1b1a17;filter:drop-shadow(0 6px 0 #1b1a17) drop-shadow(0 14px 22px rgba(0,0,0,.65))}
.t b{font-weight:900;background:linear-gradient(180deg,#ffe08a 0%,#e7b545 50%,#9c6a12 100%);-webkit-background-clip:text;background-clip:text}
.s{display:inline-flex;align-items:center;gap:.5em;margin-top:.12em;padding:.06em .7em .1em;font-weight:800;font-size:var(--small,84px);letter-spacing:.14em;color:#f2ead8;
 background:linear-gradient(180deg,#3d3f36,#23241f);border:4px solid #8d877c;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.18);text-shadow:0 3px 0 #000}
.s i{font-style:normal;color:#e7b545;font-size:.8em}
.tag{position:absolute;left:0;right:0;bottom:var(--bot,4%);text-align:center;font-family:'Saira Condensed';font-weight:700;font-size:var(--tag,40px);letter-spacing:.2em;color:#fff;text-shadow:0 2px 6px #000,0 0 2px #000;opacity:.92}
</style></head><body>
<div class="bg"></div><div class="grade"></div>
<div class="logo"><div class="t">TARA<b>WAR</b></div><div class="s"><i>★</i>STEEL FRONT<i>★</i></div></div>
<div class="tag">WWII TANK BATTLES</div>
</body></html>
