<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taragüí War: Frente de Acero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --khaki:#c9b98a; --paper:#efe7d2; --ally:#8fd16a; --enemy:#ff5a3c; --amber:#ffc65c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--paper);
  font-family:'Saira Condensed',ui-sans-serif,system-ui,sans-serif;user-select:none}
#game canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{position:fixed;inset:0;pointer-events:none}
.hud{position:fixed;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#top{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center}
#tickets{display:flex;gap:12px;align-items:center;justify-content:center;font-size:26px;font-weight:700}
#tickets .a{color:var(--ally);min-width:52px;text-align:right} #tickets .e{color:var(--enemy);min-width:52px;text-align:left}
#zones{display:flex;gap:6px}
.zb{width:34px;height:34px;display:grid;place-items:center;font-size:20px;background:rgba(20,18,14,.7);outline:2px solid var(--paper);position:relative;overflow:hidden}
.zb i{position:absolute;left:0;bottom:0;width:100%;height:0;opacity:.55}
.zb span{position:relative}
#specT{left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font-size:20px;display:none}
body.spec #specT{display:block}
#nflash{position:fixed;inset:0;background:#fffaf0;opacity:0;pointer-events:none;z-index:6}
#tutbox{position:fixed;left:50%;top:92px;transform:translateX(-50%);max-width:min(620px,90vw);background:rgba(16,18,13,.86);border:1px solid rgba(239,231,210,.35);
  color:var(--paper);padding:10px 16px;font:500 16px/1.4 "Saira Condensed",sans-serif;text-align:center;display:none;z-index:4}
#tutbox b{color:var(--amber);display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
body.tut #tutbox{display:block}
.guide{max-height:62vh;overflow:auto;text-align:left} .guide h2{margin:14px 0 4px} .guide p{margin:4px 0} body.thermal #vig{opacity:.55!important;background:radial-gradient(circle at center,transparent 45%,rgba(0,0,0,.85))} body.spec #status{display:none}
#tabB{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,94vw);max-height:86vh;overflow:auto;background:rgba(20,22,18,.9);border:1px solid rgba(239,231,210,.25);padding:12px 18px;z-index:40;display:none;color:var(--paper);font-family:'Saira Condensed',sans-serif}
#tabB.on{display:block}#tabB h2{margin:6px 0 2px;font-size:20px;display:flex;justify-content:space-between}#tabB .ally{color:var(--ally)}#tabB .foe{color:var(--enemy)}#tabB .dead td{opacity:.55}#tabB tr.me td{background:rgba(232,196,96,.16)}#tabB .ft{font-size:13px;opacity:.7;margin-top:6px}
@media (min-width:900px){#tabB .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}}
table.sum{border-collapse:collapse;width:100%;font-size:16px;margin:4px 0 14px;table-layout:fixed}
table.sum th.n{text-align:right}
table.sum td,table.sum th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sum tbody tr:nth-child(even) td{background:rgba(239,231,210,.035)}
table.sum tbody tr:hover td{background:rgba(239,231,210,.08)}
table.sum td.pts{font-weight:700;color:var(--paper)}
table.sum .ia{font-size:11px;letter-spacing:.06em;color:var(--khaki);opacity:.75;border:1px solid rgba(201,185,138,.45);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
table.sum .mvp{color:var(--amber);margin-left:6px}
table.sum tfoot td{border-top:1px solid rgba(239,231,210,.3);border-bottom:0;color:var(--khaki);font-weight:700}
.sumwrap h2.tm{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px;padding-left:10px;border-left:4px solid var(--ally)}
.sumwrap h2.tm.foe{border-left-color:var(--enemy)}
.sumwrap h2.tm .w{font-size:13px;letter-spacing:.12em;background:var(--amber);color:#1a1712;padding:1px 8px;border-radius:3px}
.sumwrap h2.tm .tk{margin-left:auto;font-size:15px;color:var(--khaki);font-weight:500;border:0!important;background:none!important;padding:0!important;box-shadow:none!important}
table.sum th{text-align:left;color:var(--khaki);font-weight:700;padding:3px 6px;border-bottom:1px solid rgba(239,231,210,.3)}
table.sum td{padding:3px 6px;border-bottom:1px solid rgba(239,231,210,.1)}
table.sum td.n{text-align:right;font-variant-numeric:tabular-nums}
table.sum tr.me td{color:var(--amber);font-weight:700}
.sumwrap{max-height:52vh;overflow:auto;margin-bottom:12px;background:rgba(14,13,10,.86);border:1px solid rgba(239,231,210,.18);border-radius:4px;padding:6px 16px 2px;max-width:1100px}
#counts{font-size:16px;opacity:.85;margin-top:2px}
#feed{top:calc(12px + env(safe-area-inset-top,0px));right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#feed div{background:rgba(20,18,14,.6);padding:2px 10px;font-size:16px}
#hitmsg{left:0;right:0;top:60%;text-align:center;font-size:26px;font-weight:700;opacity:0;transition:opacity .25s}
@keyframes xrFire{50%{fill:#ffd040}}
body.freeaim #game canvas{cursor:none}
/* HUD estilo War Thunder: dial de daños abajo a la izquierda, barra de acciones abajo al centro */
#status{left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:236px;text-shadow:0 1px 2px #000;font-size:13px}
#status .wt-name{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(239,231,210,.75);margin:0 0 2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status .wt-dial{position:relative;width:220px;height:220px}
#xray{width:220px;height:220px;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
#xray .wt-ring{fill:rgba(22,34,72,.58);stroke:rgba(150,170,230,.55);stroke-width:2}
#xray .wt-in{fill:rgba(14,22,50,.45);stroke:rgba(150,170,230,.35);stroke-width:1.5}
#xray .wt-lbl{fill:#e8ecff;font:700 13px system-ui,sans-serif;text-anchor:middle;letter-spacing:.04em} #xray .wt-lbl.off{fill:rgba(232,236,255,.25)}
#xray .xr-hull{fill:rgba(200,210,240,.12);stroke:rgba(230,236,255,.75);stroke-width:1.6}
#xray .xr-ok{fill:rgba(220,228,255,.28)} #xray .xr-dmg{fill:#f2b33a} #xray .xr-dead{fill:#e8402a} #xray .xr-off{display:none}
#xray .xr-fire{fill:#ff6a1a;animation:xrFire .4s steps(2) infinite}
#xray .crew.xr-ok{fill:#f4f6ff} #xray .crew.xr-dmg{fill:#f2b33a} #xray .crew.xr-dead{fill:#1c1c1c;stroke:#e8402a;stroke-width:1.2}
#status .wt-crew,#status .wt-ammo{position:absolute;display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;color:#f4f6ff}
#status .wt-crew{left:2px;bottom:22px} #status .wt-ammo{right:-4px;top:76px}
#status .wt-crew svg{width:24px;height:18px;fill:#f4f6ff} #status .wt-ammo svg{width:10px;height:16px;fill:#f4f6ff}
#status .wt-tele{margin:2px 0 0 8px;font:700 15px/1.25 system-ui,sans-serif;color:#f4f6ff;letter-spacing:.02em}
#status .wt-tele b{font-weight:700} #status .wt-tele .gear{border:none;padding:0;color:inherit}
#status .wt-sub{font-size:12px;opacity:.75;margin-top:2px}
#status .wt-state{margin:3px 0 0 8px;font-size:12px}
#tkA.bleed,#tkE.bleed{animation:bleed 1s ease-in-out infinite} @keyframes bleed{50%{opacity:.35}}
#ammobar{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-shadow:0 1px 2px #000}
#ammobar .wt-wpn{display:flex;gap:6px}
#ammobar .wt-wpn .w{display:flex;align-items:center;gap:6px;padding:3px 8px;background:rgba(16,22,40,.72);border:1px solid rgba(150,170,230,.3);font:700 13px system-ui,sans-serif;color:#f4f6ff}
#ammobar .wt-wpn svg{width:34px;height:9px;fill:#cfd6ee} #ammobar .bar{display:block;width:70px;height:7px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 4px)}
#ammobar .bar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,#e8ecff 0 2px,transparent 2px 4px)}
#ammoSlots{display:flex;gap:3px}
#ammoSlots .as{position:relative;width:58px;display:flex;flex-direction:column;align-items:stretch;font:700 12px system-ui,sans-serif;color:#f4f6ff;cursor:default}
#ammoSlots .as .k{text-align:center;background:rgba(40,52,84,.85);border:1px solid rgba(150,170,230,.35);border-bottom:none;padding:1px 0;font-size:12px}
#ammoSlots .as .ic{position:relative;height:50px;background:rgba(14,20,36,.78);border:1px solid rgba(150,170,230,.35);display:grid;place-items:center;overflow:hidden;font-size:24px}
#ammoSlots .as .ic svg{width:26px;height:40px}
#ammoSlots .as .n{position:absolute;right:3px;bottom:1px;font-size:12px;text-shadow:0 1px 2px #000}
#ammoSlots .as .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.55)}
#ammoSlots .as.sel .ic{border-color:#f4f6ff;box-shadow:inset 0 0 0 1px #f4f6ff} #ammoSlots .as.off .ic{opacity:.45}
#ammoSlots .as.empty .ic{opacity:.3} #ammoSlots .gap{width:10px}
#ammobar .ab-info{display:flex;gap:12px;font-size:11px;color:rgba(239,231,210,.6)} #ammobar .ab-info b{color:var(--paper);font-weight:600}
body.deploy #ammobar,body.spec #ammobar,body.menu #ammobar{display:none}
#fsBtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:72px;z-index:40;width:40px;height:40px;font-size:22px;line-height:1;background:rgba(20,18,14,.6);color:var(--paper);border:1px solid rgba(239,231,210,.35);cursor:pointer;pointer-events:auto}
body:not(.menu) #fsBtn{right:14px;top:auto;bottom:calc(240px + env(safe-area-inset-bottom,0px));width:34px;height:34px;font-size:18px;opacity:.75}
/* Pantalla principal con la ilustración: el arte se escala como "cover" y los botones tapan la barra dibujada */
body.menu.home:not(.deploy) #overlay{background:#0d0c0a}
.homeArt{position:fixed;left:50%;top:50%;width:max(100vw,calc(100vh*2.2648));height:max(100vh,calc(100vw/2.2648));transform:translate(-50%,-50%);
  background:url(../img/portada.jpg) center/100% 100% no-repeat;pointer-events:none}
.homeShade{position:fixed;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(10,10,8,0),rgba(10,10,8,.85) 55%,rgba(10,10,8,.95));pointer-events:none}
.homeArt .press{position:absolute;left:50%;top:83.8%;transform:translate(-50%,-50%);padding:.45em 1.8em;background:rgba(14,13,11,.97);border:1px solid rgba(239,231,210,.25);
  font:700 clamp(13px,1.5vw,22px) system-ui,sans-serif;letter-spacing:.12em;color:var(--paper);white-space:nowrap;pointer-events:auto;cursor:pointer;animation:pressP 1.6s ease-in-out infinite}
@keyframes pressP{50%{opacity:.55}}
.homeBar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 10px;z-index:5}
.homeBar .hb{min-width:150px;padding:9px 18px;font:700 15px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#e8e4da;cursor:pointer;
  background:linear-gradient(180deg,#3a4250,#232831);border:1px solid #5b6576;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.homeBar .hb:hover{background:linear-gradient(180deg,#4a5465,#2c323d)} .homeBar .hb.main{border-color:#b83a2c;box-shadow:inset 0 0 0 1px #b83a2c;background:linear-gradient(180deg,#4a2c28,#2a1a18)}
.homeCopy{position:fixed;right:14px;bottom:2px;font-size:11px;color:rgba(239,231,210,.45);z-index:5}
/* Árbol de vehículos */
.tree{display:flex;flex-direction:column;gap:6px;max-height:62vh;overflow:auto;padding-right:4px}
.tree .vrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:rgba(0,0,0,.35);border:1px solid rgba(239,231,210,.15)}
.tree .vrow .br{font:700 18px system-ui,sans-serif;color:var(--khaki);text-align:center} .tree .vrow b{display:block;font-size:17px} .tree .vrow small{opacity:.7}
.tree .vrow.own{border-color:rgba(127,176,105,.5)} .tree .vrow.res{border-color:var(--amber)} .tree .vrow.lock{opacity:.5}
.tree .vrow.in{background:rgba(127,176,105,.18)} .tree .pbar{height:6px;background:rgba(255,255,255,.12);margin-top:5px} .tree .pbar i{display:block;height:100%;background:var(--amber)}
.tree button{font:600 14px inherit;font-family:inherit;padding:5px 10px;background:rgba(0,0,0,.45);color:var(--paper);border:1px solid rgba(239,231,210,.35);cursor:pointer}
.rpbox{margin:10px 0;padding:10px;background:rgba(0,0,0,.35);border-left:3px solid var(--amber)} .rpbox .pbar{height:7px;background:rgba(255,255,255,.12);margin-top:6px} .rpbox .pbar i{display:block;height:100%;background:var(--amber)}
.setB{position:fixed;z-index:10;top:calc(16px + env(safe-area-inset-top,0px));right:18px;width:46px;height:46px;font-size:26px;line-height:1;background:rgba(20,18,14,.7);color:var(--paper);border:1px solid rgba(239,231,210,.35);cursor:pointer}
.setB:hover{background:rgba(60,55,40,.85)}
.side.home .go.big{display:block;width:100%;max-width:340px;font-size:26px;padding:14px 0;margin:10px 0}
.binds{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;font-size:16px;margin-bottom:14px;max-width:440px}
.binds .kb{min-width:120px;padding:4px 10px;font:600 15px inherit;font-family:inherit;background:rgba(0,0,0,.4);color:var(--paper);border:1px solid rgba(239,231,210,.35);cursor:pointer}
.binds .kb.cap{border-color:var(--amber);color:var(--amber)}
.side.settings{max-height:92vh;overflow:auto}
.chk{display:block;margin:4px 0 12px;font-size:16px}
body.brief .hud,body.brief #mm{display:none}
#nukeSum{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:30;display:none;min-width:200px}
.brief{max-width:560px} .brief .kick{color:var(--khaki);letter-spacing:.1em;text-transform:uppercase;font-size:14px} .brief h1{margin-top:2px}
body.deploy #ammobar,body.spec #ammobar,body.menu #ammobar{display:none}
@keyframes hitPop{0%{transform:scale(1.45)}60%{transform:scale(.96)}100%{transform:scale(1)}}
#mm{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:200px;height:200px;
  background:rgba(40,36,28,.75);outline:1px solid rgba(239,231,210,.35);pointer-events:none}
#vig{inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(170,30,10,.7));opacity:0;transition:opacity .4s}
#banner{left:0;right:0;top:24%;text-align:center;font-size:48px;font-weight:700;opacity:0;transition:opacity .4s}
#banner small{display:block;font-size:20px;font-weight:500;opacity:.85}
#scope{inset:0;opacity:0;background:radial-gradient(circle at center,transparent 38vmin,rgba(0,0,0,.92) 39vmin)}
body.menu .hud,body.menu #mm{display:none}
body.deploy #status,body.deploy #scope{display:none}
#overlay{position:fixed;inset:0;display:flex;padding:24px;box-sizing:border-box;overflow:auto;
  background:linear-gradient(180deg,rgba(28,25,20,.5),rgba(28,25,20,.9))}
body.menu:not(.deploy) #overlay{background:linear-gradient(0deg,rgba(12,11,9,.98) 0,rgba(12,11,9,.96) 18%,rgba(12,11,9,0) 32%),linear-gradient(90deg,rgba(20,18,14,.9) 0,rgba(20,18,14,.65) 480px,rgba(20,18,14,.25) 820px),url(../img/portada.jpg) center/cover no-repeat}
body.deploy #overlay{background:linear-gradient(90deg,rgba(28,25,20,.92) 0,rgba(28,25,20,.75) 620px,rgba(28,25,20,0) 900px)}
.panel{max-width:640px;width:100%;margin:auto}
body.deploy .panel{margin:auto auto auto 0}
.panel h1{font-size:clamp(50px,11vw,96px);margin:0;line-height:.85;color:var(--khaki)}
.panel p{font-size:19px;line-height:1.45;margin:12px 0 14px;max-width:50ch}
.panel h2{font-size:18px;font-weight:700;margin:0 0 6px;color:var(--khaki)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:17px;margin-bottom:16px}
.keys b{color:var(--khaki)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pick.two{grid-template-columns:repeat(2,1fr)}
.tk{font:inherit;text-align:left;background:rgba(239,231,210,.06);color:var(--paper);border:1px solid rgba(239,231,210,.25);padding:10px 12px;cursor:pointer;font-weight:500;font-size:15px;line-height:1.3}
.tk b{display:block;font-size:22px;color:var(--khaki)}
.tk em{display:block;font-style:normal;font-weight:700;margin-top:4px}
.tk[aria-checked="true"]{border-color:var(--khaki);background:rgba(201,185,138,.18)}
.tk:hover{background:rgba(239,231,210,.12)}
.tk[aria-disabled="true"]{opacity:.38;cursor:not-allowed}
body.menu:not(.deploy) .panel{margin:0 auto 0 0;max-width:none}
.side{width:min(460px,94vw);display:flex;flex-direction:column;gap:6px}
.logo{font-size:clamp(46px,8vw,76px)!important;line-height:.9!important;margin-bottom:10px!important}
.logo small{display:block;font-size:.34em;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);margin-top:6px}
.mi{font:inherit;font-size:22px;font-weight:700;text-align:left;background:rgba(16,15,12,.74);color:var(--paper);border:1px solid rgba(239,231,210,.22);
  padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.mi:hover,.mi.open{border-color:var(--khaki);color:var(--khaki)}
.mi i{font-style:normal;transition:transform .2s;opacity:.8} .mi.open i{transform:rotate(180deg)}
.sec{background:rgba(16,15,12,.84);border:1px solid rgba(239,231,210,.15);border-top:0;padding:12px 14px;margin-top:-6px}
.sec p.s{font-size:15px;margin:0 0 10px}
.side .pick{gap:6px;margin-bottom:10px} .side .tk{font-size:13px;padding:7px 9px} .side .tk b{font-size:17px}
.side .keys{font-size:14px} .side .go{margin-top:4px}
label.sens{display:flex;gap:12px;align-items:center;font-size:17px;margin-bottom:18px}
label.sens input{flex:1;accent-color:var(--khaki)}
.hgRank{position:absolute;left:12px;bottom:96px;width:250px;background:rgba(18,20,23,.78);border:1px solid #444b55;padding:7px 10px;color:#e8e4da;font:13px system-ui,sans-serif}
.hgRank .btns{display:flex;gap:5px;margin-top:6px} .hgRank b{color:var(--khaki)} .hgRank small{display:block;opacity:.7;margin-top:3px}
.chI{background:rgba(255,255,255,.05);border:1px solid #444b55;padding:7px 9px;margin:6px 0;font-size:14px} .chI.ok{border-color:var(--ally)} .chI.ok b{color:var(--ally)} .chI small{opacity:.75}
.camG{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0} .camI{background:#262b33;border:1px solid #4d5562;color:#e8e4da;padding:6px;cursor:pointer;text-align:center;font:12px system-ui,sans-serif}
.camI.sel{border-color:var(--khaki)} .camI b{display:block;font-size:12px;margin-top:4px} .camI small{opacity:.75} .sw{display:block;height:38px;border:1px solid #000}
@media (max-width:700px){.camG{grid-template-columns:repeat(2,1fr)}}
.lbT{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px} .lbT>div{background:rgba(0,0,0,.3);border:1px solid rgba(239,231,210,.2);padding:8px 10px;font-size:17px}
#awards{right:16px;top:38%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#awards div{background:linear-gradient(90deg,rgba(20,18,14,0),rgba(20,18,14,.75) 30%);padding:3px 12px 3px 40px;font-size:20px;color:var(--paper);transition:opacity .6s,transform .6s}
#awards div b{color:var(--amber);margin-right:6px} #awards div.out{opacity:0;transform:translateX(30px)}
#oob{left:0;right:0;top:calc(96px + env(safe-area-inset-top,0px));text-align:center;font:700 40px 'Saira Condensed',sans-serif;color:#ff4a32;opacity:0;transition:opacity .2s;letter-spacing:.04em}

  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; const g=AC.createGain(); g.gain.value=vol;
  const pn=AC.createPanner(); pn.panningModel='equalpower'; pn.distanceModel='inverse'; pn.refDistance=ref; pn.rolloffFactor=1;
  src.connect(f).connect(g).connect(pn).connect(extBus); src.start(0,start);
  const L={ dead:false, set(p){ if(pn.positionX){pn.positionX.value=p.x;pn.positionY.value=p.y;pn.positionZ.value=p.z;} else pn.setPosition(p.x,p.y,p.z);
      const d=p.distanceTo(camera.position); f.frequency.value=Math.max(500,lp*Math.exp(-d/500)); },

const RADIO_IDX={'¡Cargado!':0,'¡Cargador listo!':0,'¡Penetración!':1,'¡Rebotó!':2,'No penetró.':3,'¡Blanco destruido!':4,'¡Nos penetraron!':5,
  '¡Rebotó en el blindaje!':6,'El blindaje aguantó.':7,'¡Oruga rota!':8,'¡Motor destruido!':9,'¡Fuego a bordo!':10,'¡Cañón dañado!':11,'¡Tripulación lista! ¡Adelante!':13};

let radioBusy=0, radioCurve=null, mgLastShot=-1;
function radio(msg,prio=1){
  if(!radioOn||!AC||state!=='play') return;
  const idx=RADIO_IDX[msg]??(String(msg).startsWith('¡Perdimos')?12:-1); if(idx<0) return;
  const nat=(playerCrew&&playerCrew.nation)||allyNation, lang=LANG_OF[nat]||'es', buf=VO[lang]&&VO[lang][idx]; if(!buf) return;
  const t0=AC.currentTime+.12; if(prio<2&&t0<radioBusy) return;
  if(!radioCurve){ radioCurve=new Float32Array(2048); for(let i=0;i<2048;i++){ const x=i/1023.5-1, y=Math.tanh(x*5)/Math.tanh(5); radioCurve[i]=Math.round(y*24)/24; } } // saturación + cuantizado (equipo viejo)
  const urgent=prio>=2, rate=urgent?1.16:1.1;
  // Cadena: compresor fuerte → banda de radio (450-2700 Hz) con pico nasal → saturación → recorte final
  const out=AC.createGain(); out.gain.value=.85; out.connect(master);
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-34; comp.knee.value=4; comp.ratio.value=14; comp.attack.value=.002; comp.release.value=.08;
  const pre=AC.createGain(); pre.gain.value=urgent?5:4;
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=450; hp.Q.value=.9;
  const pk=AC.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=1500; pk.Q.value=1.4; pk.gain.value=10;
  const ws=AC.createWaveShaper(); ws.curve=radioCurve; ws.oversample='2x';
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2700; lp.Q.value=1.2;
  const lp2=AC.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=3200;
  const bus=AC.createGain(); bus.connect(comp).connect(pre).connect(hp).connect(pk).connect(ws).connect(lp).connect(lp2).connect(out);
  // La voz, más rápida y un poco más aguda: suena apurada, como gritando bajo fuego.
  const src=AC.createBufferSource(); src.buffer=buf; src.playbackRate.value=rate; const vg=AC.createGain(); vg.gain.value=1.3; src.connect(vg).connect(bus);
  const dur=buf.duration/rate;

  const ck=AC.createBufferSource(); ck.buffer=noiseBuf; const cg=AC.createGain(); cg.gain.setValueAtTime(.6,t0-.07); cg.gain.exponentialRampToValueAtTime(.001,t0-.03); ck.connect(cg).connect(bus); ck.start(t0-.07,Math.random()*.5,.05);
  // Ruido de la batalla dentro de la transmisión: motor del tanque y estática que pasan por el mismo micrófono
  const bg=(name,vol,loopLen,off)=>{ if(!SFX[name]||!SFX[name].length) return; const n=AC.createBufferSource(); n.buffer=SFX[name][0]; n.loop=true; if(loopLen){n.loopStart=.2;n.loopEnd=.2+loopLen;}
    const g=AC.createGain(); g.gain.setValueAtTime(0,t0-.07); g.gain.linearRampToValueAtTime(vol,t0-.02); g.gain.setValueAtTime(vol,t0+dur); g.gain.linearRampToValueAtTime(0,t0+dur+.1);
    n.connect(g).connect(bus); n.start(t0-.07,off); n.stop(t0+dur+.15); };
  bg('static',.22,LOOP_LEN.static,.2+Math.random()*2); bg('drive',.35,LOOP_LEN.drive,.2+Math.random()*2);
  if(urgent&&SFX.mgshot&&Math.random()<.6) for(let i=0;i<5;i++){ const m=AC.createBufferSource(); m.buffer=SFX.mgshot[0]; const mg=AC.createGain(); mg.gain.value=.25; m.connect(mg).connect(bus); m.start(t0+dur*.3+i*.09); }
  src.start(t0);

  if(SFX.squelch&&SFX.squelch.length){ const sq=AC.createBufferSource(); sq.buffer=SFX.squelch[0]; const qg=AC.createGain(); qg.gain.value=.6; sq.connect(qg).connect(out); sq.start(t0+dur+.03); }
  radioBusy=t0+dur+.45;
}

function radioWatch(t){

function boom(vol,len=.9,freq=900){

  f.frequency.setValueAtTime(freq,t); f.frequency.exponentialRampToValueAtTime(60,t+len);

  const og=AC.createGain(); og.gain.setValueAtTime(vol,t); og.gain.exponentialRampToValueAtTime(.001,t+.35);

// Impacto en el tubo del cañón: con daño leve se puede disparar (peor puntería); destruido, no dispara hasta repararlo

// Explosivo que no entra: onda sobre tanques cercanos con blindaje fino y orugas

  <h2>Objetivo</h2><p>Cada bando empieza con 400 tickets. Bajan cuando el enemigo controla más puntos de captura (A, B y C) y cuando perdés tanques. Gana quien deja al otro en cero o sin tanques para salir. La nuke, a los 1500 puntos, gana la batalla de una.</p>
  <h2>Tu línea de tanques</h2><p>Elegís un tanque ligero, medio o principal. Cada uno sale una vez y puede reaparecer otra si te alcanzan los puntos de reaparición. Los ganás penetrando, destruyendo, capturando y abatiendo infantería. El tanque de élite sale una sola vez.</p>
  <h2>Controles</h2><p>W/S acelerar y frenar, A/D girar, mouse para mirar, clic izquierdo cañón, clic derecho o Espacio ametralladora, Shift mira telescópica, F artillería, G ataque aéreo, N nuke, T visión térmica, V vista aérea, Esc pausa.</p>
  <h2>Apuntar en modo realista</h2><p>Los tanques con telémetro compensan solos la caída del proyectil. En los demás usá la escala de la mira: las marcas 2, 4 y 6 son 200, 400 y 600 metros. A más distancia, apuntá más arriba.</p>
  <h2>Munición</h2><p>Se elige sola mientras recargás, según lo que tengas en la mira. La cinética pierde fuerza con la distancia y rebota en ángulos cerrados; la carga hueca no pierde fuerza; la HESH ignora la inclinación pero rebota fácil; la explosiva sirve contra infantería, edificios y blindados livianos.</p>
  <h2>Blindaje y ángulo</h2><p>El frente es lo más grueso. Pegale a los costados y atrás. Si el impacto llega muy inclinado, rebota. Para protegerte, mostrá el frente un poco girado.</p>
  <h2>Daños</h2><p>Cada penetración lanza esquirlas que pueden matar tripulantes o romper el motor, el cañón o la munición. La oruga rota te deja inmóvil 10 segundos y el cañón dañado no dispara por 12. Si muere el artillero o el conductor, otro toma el puesto. El tanque cae con menos de dos tripulantes o si explota la munición.</p>
  <h2>Consejos</h2><p>No te quedes quieto en campo abierto, usá edificios y lomas para cubrirte, disparar en movimiento sin estabilizador es casi tirar al aire, y los soldados antitanque pueden sorprenderte en los barrios.</p></div>
  <button class="go" id="gtut">Hacer el tutorial</button><button class="go alt" id="gback">Volver</button>`;
  $('gtut').onclick=()=>{initAudio(); if(AC.state==='suspended')AC.resume(); startTutorial();}; $('gback').onclick=()=>mainMenu();
}

function hgInit(){
  if(hg) return hg;
  const sc=new THREE.Scene(); sc.background=new THREE.Color(0x202326); sc.fog=new THREE.Fog(0x202326,30,90);
  sc.add(new THREE.HemisphereLight(0xe6ecf2,0x2c2822,.9));
  const sl=new THREE.DirectionalLight(0xfff4e0,.95); sl.position.set(9,14,7); sc.add(sl);
  const fl=new THREE.DirectionalLight(0x9fb4d0,.35); fl.position.set(-8,5,-6); sc.add(fl);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(40,64),new THREE.MeshLambertMaterial({color:0x34363a})); floor.rotation.x=-Math.PI/2; sc.add(floor);
  const pad=new THREE.Mesh(new THREE.CircleGeometry(7.5,64),new THREE.MeshLambertMaterial({color:0x45474b})); pad.rotation.x=-Math.PI/2; pad.position.y=.01; sc.add(pad);
  const ring=new THREE.Mesh(new THREE.RingGeometry(7.4,7.6,64),new THREE.MeshBasicMaterial({color:0xc9b98a})); ring.rotation.x=-Math.PI/2; ring.position.y=.02; sc.add(ring);
  const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,200);
  hg={sc,cam,obj:null,key:null,yaw:.9,drag:null};
  renderer.domElement.addEventListener('mousedown',e=>{ if(hangarOn()) hg.drag=e.clientX; });
  document.addEventListener('mouseup',()=>{ if(hg) hg.drag=null; });
  document.addEventListener('mousemove',e=>{ if(hg&&hg.drag!=null&&hangarOn()){ hg.yaw-=(e.clientX-hg.drag)*.008; hg.drag=e.clientX; } });
  return hg;
}

function hgShow(key,nat){

function hgRender(dt){
  const H=hgInit(); if(!H.obj) return false;
  if(H.drag==null) H.yaw+=dt*.12;
  const M=H.obj.T.m, R=Math.max(9,M.L*1.55+5), w=innerWidth, h=innerHeight;
  H.cam.aspect=w/h; H.cam.position.set(Math.sin(H.yaw)*R,R*.32+1.5,Math.cos(H.yaw)*R); H.cam.lookAt(0,1.2,0);
  H.cam.setViewOffset(w,h,w>900?w*.1:0,h*.06,w,h); H.cam.updateProjectionMatrix();
  renderer.render(H.sc,H.cam); return true;
}

// Movimiento suave de los tanques que maneja otra PC
function netLerp(t,dt){
  const g=t.tgt; if(!g) return; const k=Math.min(1,dt*12);
  g.x+=Math.sin(g.h)*g.spd*dt; g.z+=Math.cos(g.h)*g.spd*dt;
  const ox=t.pos.x, oz=t.pos.z;
  if(Math.hypot(g.x-t.pos.x,g.z-t.pos.z)>25){ t.pos.x=g.x; t.pos.z=g.z; } else { t.pos.x+=(g.x-t.pos.x)*k; t.pos.z+=(g.z-t.pos.z)*k; }
  t.heading=wrap(t.heading+wrap(g.h-t.heading)*k); t.turretYaw=wrap(t.turretYaw+wrap(g.ty-t.turretYaw)*k); t.gunPitch+=(g.gp-t.gunPitch)*k; t.speed=g.spd;
  t.turret.rotation.y=t.turretYaw; t.gunPivot.rotation.x=-t.gunPitch;
  placeOnGround(t,dt); t.moved=Math.hypot(t.pos.x-ox,t.pos.z-oz)/Math.max(dt,1e-4);
}

// ----- Invitado -----
async function netJoin(code){
  code=(code||'').toUpperCase(); if(code.length<4){ netErr('Escribí el código de la sala.'); return; }
  try{ await loadPeer(); }catch(e){ netErr(e.message); return; }
  $('onErr')&&($('onErr').textContent='Conectando…');
  const peer=new Peer(undefined,peerOpts()); let opened=false;
  peer.on('error',e=>{ if(!net.on||!opened){ netErr(e.type==='peer-unavailable'?'No existe una sala con ese código, o ya se cerró.':'No se pudo conectar ('+e.type+').'); try{peer.destroy();}catch(_){} } else console.warn(e); });
  peer.on('open',()=>{
    const conn=peer.connect(ROOM_PFX+code.toLowerCase(),{reliable:true,serialization:'json'});
    conn.on('open',()=>{ opened=true; net.lastT=performance.now(); Object.assign(net,{on:true,host:false,guest:true,peer,hostConn:conn,code,name:myName()}); conn.send({t:'hi',name:net.name,side:net.side?1:0,nation:chosenNation,garage:garageOf(chosenNation),lvs:Object.fromEntries(garageOf(chosenNation).map(k=>[k,tankLv(k)])),cams:PROG.camo||{}}); guestWait(null); });
    conn.on('data',d=>{ try{ guestData(d); }catch(e){ console.error(e); } });
    conn.on('close',()=>{ if(net.guest&&net.hostConn===conn){ netLeave(true); mainMenu(); banner('Se cortó la conexión','El anfitrión cerró la sala o se desconectó',4); } });
  });
}

    ${L&&L.mode==='vs'?`<h2>Tu equipo</h2><div class="hgOpt" style="max-width:420px"><button data-sd="0" class="${!net.side?'sel':''}">Equipo A (con el anfitrión)</button><button data-sd="1" class="${net.side?'sel':''}">Equipo B (contra el anfitrión)</button></div>`:''}
    <button class="go alt" id="lbQuit">Salir de la sala</button>`;
  $('lbQuit').onclick=()=>mainMenu();

      if(Array.isArray(shot)&&!P.dead){ const o=infEye(P), a=new THREE.Vector3(+shot[0],+shot[1],+shot[2]); tracer(o,a,P.team===0?0xffd080:0xff9a70); infAmbNote(o); boom(distVol(o,.06),.05,3000); } }
    for(const [id,P] of netInf) if(!iseen.has(id)){ removeInf(P); netInf.delete(id); } }
  if(Array.isArray(m.tr)){ const seen2=new Set();

    for(let i2=traffic.length-1;i2>=0;i2--) if(!seen2.has(traffic[i2].id)){ scene.remove(traffic[i2].g); traffic.splice(i2,1); } }

    for(const [id,x,y,z,yaw,pitch,st] of m.pl){ seen3.add(id); let q=civPlanes.find(c=>c.id===id);

      q.tp=new THREE.Vector3(x,y,z); q.tyaw=yaw; q.tpitch=pitch; if(st===3&&q.state!==3){ blast(q.tp.clone(),2.2); } q.state=st; }
    for(const q of civPlanes.slice()) if(!seen3.has(q.id)) removePlane(q); }
  (m.z||[]).forEach((v,i)=>{ const Z=zones[i]; if(!Z) return; const was=Z.owner, sg=net.swap?-1:1; Z.cap=v[0]*sg; Z.owner=v[1]*sg;

function guestData(d){
  if(!d||typeof d!=='object') return;
  net.lastT=performance.now(); if(d.t==='p') return;
  switch(d.t){
    case 'lobby': if(state==='lobby') guestWait(d); break;
    case 'full': netLeave(); netErr('La sala está llena.'); break;
    case 'start': guestStart(d); break;
    case 's': guestSnap(d); break;
    case 'ok': {
      if(!VEH[d.key]) return; if(player&&player.dead){ removeTank(player); } { const dup=netTanks.get(d.id); if(dup){ removeTank(dup); netTanks.delete(d.id); } }
      player=makeTank(playerCrew,d.key,+d.x,+d.z,+d.h,d.id); playerCrew.tank=player;
      camYaw=player.heading; camPitch=.1; camDist=14; state='play'; syncIntro(); setTimeout(()=>radio('¡Tripulación lista! ¡Adelante!',2),600);
      $('overlay').style.display='none'; document.body.classList.remove('deploy');
      banner(player.T.label,`Desplegado en ${String(d.label||'').toLowerCase()}`,2.5); updateHud(); break; }
    case 'no': renderDeploy(); break;
    case 'fd': { let col=String(d.color).slice(0,24); if(net.swap) col=col==='var(--ally)'?'var(--enemy)':col==='var(--enemy)'?'var(--ally)':col; feed(String(d.txt).slice(0,160),col,true); break; }
    case 'hm': hitMsg(String(d.txt).slice(0,120),String(d.color).slice(0,24)); break;
    case 'hf': hitFrom(+d.x,+d.z,+d.s||1); break;
    case 'a10': { const t=player&&player.id===d.id?player:netTanks.get(d.id); if(t&&!t.dead){ t.a10=true; a10Strike(t); } break; }
    case 'sup': supFx(d); break;
    case 'ping': { const P=(d.p||[]).map(Number); if(P.length===3&&P.every(isFinite)) makePing(0,P[0],P[1],P[2],d.k,String(d.name||'').slice(0,24),d.zid); break; }
    case 'aw': showAward(String(d.n).slice(0,40),d.s|0); break;
    case 'rk': { if(!Array.isArray(d.p)||!Array.isArray(d.v)) break; const o=new THREE.Vector3(...d.p.map(Number)), v=new THREE.Vector3(...d.v.map(Number)); const mm=new THREE.Mesh(shellGeo,d.m?SHELL_MAT.he:SHELL_MAT.heat); mm.position.copy(o); scene.add(mm);
      shells.push({p:o.clone(),v,owner:{team:-9},m:mm,travel:0,life:d.m?14:4,A:d.m?MORTAR:ROCKET,rocket:!d.m,fx:true}); for(let k=0;k<4;k++) puff(o.clone().addScaledVector(v.clone().normalize(),-k*.6),0xcfc8b8,rand(1.5,2.5),1.2,.4,.6); boom(distVol(o,.4),.5,1500); break; }
    case 'smk': addSmoke(+d.x||0,+d.y||0,+d.z||0); break;
    case 'bd': { const b=buildings[d.i|0]; if(b) damageBuilding(b,+d.d||0,true); break; }
    case 'shot': { const t=netTanks.get(d.id); if(!t||!Array.isArray(d.p)||!Array.isArray(d.d)) return;
      t.ammoIdx=clamp(d.a|0,0,t.T.ammo.length-1); t.root.updateMatrixWorld(true);
      fireGun(t,{mp:new THREE.Vector3(...d.p.map(Number)),dir:new THREE.Vector3(...d.d.map(Number)).normalize()}); break; }
    case 'end': {
      crews=(d.crews||[]).map(c=>({name:String(c.name).slice(0,24),team:(c.team?1:0)^net.swap,uses:Object.fromEntries(Object.entries(c.uses||{}).filter(([k])=>VEH[k])),st:c.st&&typeof c.st==='object'?{side:c.st.side|0,inf:c.st.inf|0,smoke:c.st.smoke|0}:{},tk:c.tk&&typeof c.tk==='object'?c.tk:{},kills:c.kills|0,assists:c.assists|0,deaths:c.deaths|0,caps:c.caps|0,score:c.score|0,human:!!c.h,isPlayer:c.peer===net.peer.id}));
      if(document.pointerLockElement) document.exitPointerLock();
      finish((d.w?1:0)^net.swap); break; }
  }
}
